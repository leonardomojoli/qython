name: Reportar um problema
description: Algo não funciona como deveria.
labels: ["problema"]
body:
  - type: markdown
    attributes:
      value: |
        **Não escreva nomes, documentos nem dados de pacientes** (nem em imagens ou logs): esta página é pública.
  - type: dropdown
    id: onde
    attributes:
      label: Onde aconteceu
      options:
        - App desktop (Windows)
        - App desktop (macOS)
        - App desktop (Linux)
        - Servidor com Docker
        - App Android
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do Qython
      description: Está no menu do app desktop ("Ajuda") ou na tela de Configurações do celular.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: textarea
    id: o-que
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra...
        2. Clique em...
        3. Veja o erro
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava
  - type: textarea
    id: logs
    attributes:
      label: Trecho do log (se houver)
      description: "No app desktop: Ajuda → Abrir a pasta de logs. Apague qualquer dado de paciente antes de colar."
      render: text
