name: Desktop

# O app que o médico instala: Electron + PostgreSQL embarcado + backend empacotado com
# PyInstaller, sem Docker. Em cada sistema (Linux, Windows e macOS) o job:
#   1. roda os testes unitários do processo principal e do backend desktop;
#   2. empacota o backend com o PyInstaller e confere, com o `selftest` do próprio
#      executável, que nada que o app importa ficou de fora do pacote;
#   3. abre o app de verdade, sem tela (xvfb no Linux), e faz o que um médico novo faz:
#      espera /api/health, cria a conta do dono, aceita o termo, cadastra um paciente,
#      REINICIA tudo e confere que o dado cifrado continua legível (as chaves de
#      criptografia sobrevivem a uma nova abertura);
#   4. pergunta algo ao copiloto: o backend fala com a porta fixa da IA, o llama-server
#      (llama.cpp) sobe sob demanda com um modelo minúsculo (Qwen3 0.6B), responde, é
#      desligado por inatividade e volta no pedido seguinte. Prova a fiação; a qualidade
#      do Gemma 4 é avaliada à parte;
#   5. usa a biblioteca: baixa os modelos de busca (multilingual-e5 e reranker, em ONNX, com
#      SHA-256 conferido), envia um PDF (armazenamento local), o Chroma e o serviço de
#      embeddings sobem sob demanda, a pergunta encontra o trecho; parados, eles são
#      desligados e o pedido seguinte os religa com os dados intactos;
#   6. gera os instaladores (NSIS, AppImage e deb, dmg e zip), INSTALA de verdade (silencioso no
#      Windows, dpkg no Linux, dmg no macOS) e repete a fumaça no app instalado: é isso que prova
#      que os arquivos certos foram para dentro do instalador (backend, front, llama-server,
#      Postgres) e que o app abre fora da pasta do repositório.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/desktop/**"
      - "packages/web/**"
      - "packages/shared/**"
      - "backend/**"
      - "requirements.txt"
      - "requirements.lock"
      - "tests/backend/test_desktop_backend.py"
      - "tests/backend/test_ai_settings.py"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "packages/desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

env:
  # Modelo do teste de fumaça da IA: o mesmo do ia-local.yml, fixado por revisão e SHA-256.
  SMOKE_MODEL_URL: https://huggingface.co/ggml-org/Qwen3-0.6B-GGUF/resolve/13ac06624948e4d8589cb4b6f90100837342fcb8/Qwen3-0.6B-Q4_0.gguf
  SMOKE_MODEL_SHA256: da2572f16c06133561ce56accaa822216f2391ef4d37fba427801cd6736417d4

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/desktop/python/requirements.lock
            packages/desktop/python/requirements-build.txt

      - name: Bibliotecas do Electron e do xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libnss3 libgtk-3-0 libasound2t64 libxss1 libxtst6

      - name: Dependências do monorepo
        run: npm ci

      - name: Dependências do backend (lock do desktop)
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/desktop/python/requirements.lock -r packages/desktop/python/requirements-build.txt

      - name: Testes do processo principal (Electron)
        run: npm test --workspace=packages/desktop

      - name: Testes do backend desktop
        run: |
          python tests/backend/test_desktop_backend.py
          python tests/backend/test_ai_settings.py

      - name: Front do desktop (sem service worker, fontes locais)
        run: |
          npm run build:desktop --workspace=packages/web
          # O service worker guardava /api no cache do navegador (dado clínico em storage).
          if [ -n "$(find packages/web/build -maxdepth 1 -name 'sw.js' -o -maxdepth 1 -name 'registerSW.js' -o -maxdepth 1 -name 'workbox-*.js')" ]; then
            echo "::error::o build do desktop trouxe service worker"; exit 1
          fi
          if grep -rIl 'fonts.googleapis.com\|fonts.gstatic.com' packages/web/build; then
            echo "::error::o build do desktop ainda busca fontes na internet"; exit 1
          fi

      - name: Bibliotecas do PDF no Windows (Pango/GTK do MSYS2)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true  # com o banco de pacotes desatualizado, o pacman rejeita pacotes ('corrupted package (checksum)')
          install: mingw-w64-x86_64-pango mingw-w64-x86_64-ntldd

      - name: Reúne as DLLs do PDF (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: packages/desktop/python
        run: bash pdf-libs/windows.sh pdf-libs/win

      - name: Reúne as bibliotecas do PDF (macOS)
        if: runner.os == 'macOS'
        working-directory: packages/desktop/python
        run: |
          brew install pango
          python3 pdf-libs/bundle_dylibs.py pdf-libs/mac

      - name: Backend empacotado (PyInstaller)
        working-directory: packages/desktop/python
        run: |
          # Vocabulário do tiktoken embutido: o copiloto não pode depender de internet.
          python prepare_tiktoken.py
          pyinstaller --noconfirm --distpath dist --workpath build qython-backend.spec
          # PYTHONFAULTHANDLER: se uma biblioteca nativa derrubar o processo, o log mostra o ponto do Python.
          PYTHONFAULTHANDLER=1 ./dist/qython-backend/qython-backend selftest

      - name: Relatório de falha do macOS (se o backend caiu)
        if: failure() && runner.os == 'macOS'
        working-directory: packages/desktop/python
        run: |
          # O mesmo selftest sob o lldb: mostra em qual biblioteca nativa o processo cai. A pasta do pacote vai
          # em DYLD_FALLBACK_LIBRARY_PATH antes, para o executável não se reiniciar (o lldb não o acompanharia).
          export DYLD_FALLBACK_LIBRARY_PATH="$PWD/dist/qython-backend/_internal:/usr/lib"
          lldb --batch -o "process handle SIGSEGV -s true -p true" -o run -o "bt 25" -o "image list" -- ./dist/qython-backend/qython-backend selftest 2>&1 | grep -v "^\s*$" | tail -90 || true
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tail -20 || true
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*qython* 2>/dev/null | head -2); do
            echo "=== $f"; head -c 12000 "$f"
          done

      - name: Tamanho do pacote
        run: |
          {
            node packages/desktop/scripts/size-report.mjs packages/desktop/python/dist/qython-backend "Backend empacotado (${{ matrix.name }})"
            echo
            node packages/desktop/scripts/size-report.mjs packages/web/build "Front"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Reúne os recursos do app (backend, front e llama-server)
        run: |
          node packages/desktop/scripts/prepare-resources.mjs
          node packages/desktop/scripts/fetch-llama.mjs

      - name: Modelo do teste de fumaça (em cache)
        id: model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/modelos
          key: qwen3-0.6b-q4_0-${{ env.SMOKE_MODEL_SHA256 }}

      # Os modelos de busca da biblioteca (e5 + reranker, ~0,4 GB) o PRÓPRIO app baixa na fumaça, com
      # o baixador de verdade e o SHA-256 conferido; o cache só evita repetir isso a cada execução.
      - name: Modelos de busca da biblioteca (em cache)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qython-perfil/models
          key: modelos-busca-${{ runner.os }}-${{ hashFiles('packages/desktop/models.json') }}

      - name: Baixa o modelo do teste de fumaça
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/modelos"
          curl -fSL --retry 5 -o "$RUNNER_TEMP/modelos/qwen3.gguf" "$SMOKE_MODEL_URL"
          echo "$SMOKE_MODEL_SHA256  $RUNNER_TEMP/modelos/qwen3.gguf" > "$RUNNER_TEMP/modelos/qwen3.sha256"
          cd "$RUNNER_TEMP/modelos" && (sha256sum -c qwen3.sha256 2>/dev/null || shasum -a 256 -c qwen3.sha256)

      - name: Teste de fumaça (Linux, sem tela)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        env:
          QYTHON_USER_DATA: ${{ runner.temp }}/qython-perfil
          QYTHON_AI_MODEL_FILE: ${{ runner.temp }}/modelos/qwen3.gguf
          QYTHON_LLM_IDLE_SECONDS: "8"
          QYTHON_CHROMA_IDLE_SECONDS: "8"
          QYTHON_BACKEND_EXTRA_ENV: '{"COPILOT_PUBMED":"0"}'
        run: xvfb-run -a npx electron packages/desktop --smoke --no-sandbox

      - name: Teste de fumaça
        if: runner.os != 'Linux'
        timeout-minutes: 12
        env:
          QYTHON_USER_DATA: ${{ runner.temp }}/qython-perfil
          QYTHON_AI_MODEL_FILE: ${{ runner.temp }}/modelos/qwen3.gguf
          QYTHON_LLM_IDLE_SECONDS: "8"
          QYTHON_CHROMA_IDLE_SECONDS: "8"
          QYTHON_BACKEND_EXTRA_ENV: '{"COPILOT_PUBMED":"0"}'
        run: npx electron packages/desktop --smoke

      # --- Instaladores ------------------------------------------------------------------------
      - name: Instalador
        working-directory: packages/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # macOS sem assinatura
        run: npx electron-builder --publish never

      - name: Tamanho dos instaladores
        run: |
          {
            echo "### Instaladores (${{ matrix.name }})"
            echo
            echo "| Arquivo | Tamanho |"
            echo "|---|---|"
            for f in packages/desktop/release/*.exe packages/desktop/release/*.AppImage packages/desktop/release/*.deb \
                     packages/desktop/release/*.dmg packages/desktop/release/*.zip; do
              # `[ ] && echo` devolveria 1 para o padrão que não casa (o shell roda com -e).
              if [ -f "$f" ]; then echo "| $(basename "$f") | $(du -m "$f" | cut -f1) MB |"; fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepara o perfil da fumaça do app instalado (modelos em cache)
        run: |
          mkdir -p "$RUNNER_TEMP/qython-perfil-instalado"
          [ -d "$RUNNER_TEMP/qython-perfil/models" ] && cp -r "$RUNNER_TEMP/qython-perfil/models" "$RUNNER_TEMP/qython-perfil-instalado/models" || true

      - name: Instala o .deb e abre o app instalado (Linux, sem tela)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        env:
          QYTHON_USER_DATA: ${{ runner.temp }}/qython-perfil-instalado
          QYTHON_AI_MODEL_FILE: ${{ runner.temp }}/modelos/qwen3.gguf
          QYTHON_LLM_IDLE_SECONDS: "8"
          QYTHON_CHROMA_IDLE_SECONDS: "8"
          QYTHON_BACKEND_EXTRA_ENV: '{"COPILOT_PUBMED":"0"}'
        run: |
          sudo apt-get install -y ./packages/desktop/release/Qython-*-linux-amd64.deb
          test -x /opt/Qython/qython
          xvfb-run -a /opt/Qython/qython --smoke --no-sandbox

      - name: Instala o NSIS e abre o app instalado (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        env:
          QYTHON_USER_DATA: ${{ runner.temp }}/qython-perfil-instalado
          QYTHON_AI_MODEL_FILE: ${{ runner.temp }}/modelos/qwen3.gguf
          QYTHON_LLM_IDLE_SECONDS: "8"
          QYTHON_CHROMA_IDLE_SECONDS: "8"
          QYTHON_BACKEND_EXTRA_ENV: '{"COPILOT_PUBMED":"0"}'
        run: |
          installer=$(ls packages/desktop/release/Qython-*-win-x64.exe | head -1)
          "$installer" /S
          app="$LOCALAPPDATA/Programs/Qython/Qython.exe"
          for i in $(seq 1 60); do [ -f "$app" ] && break; sleep 2; done
          ls -la "$LOCALAPPDATA/Programs/Qython" | head -20
          test -f "$app"
          # Aplicativo gráfico: o Start-Process -Wait espera e devolve o código de saída.
          powershell -NoProfile -Command "\$p = Start-Process -FilePath '$(cygpath -w "$app")' -ArgumentList '--smoke' -Wait -PassThru; exit \$p.ExitCode"

      - name: Instala o dmg e abre o app instalado (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        env:
          QYTHON_USER_DATA: ${{ runner.temp }}/qython-perfil-instalado
          QYTHON_AI_MODEL_FILE: ${{ runner.temp }}/modelos/qwen3.gguf
          QYTHON_LLM_IDLE_SECONDS: "8"
          QYTHON_CHROMA_IDLE_SECONDS: "8"
          QYTHON_BACKEND_EXTRA_ENV: '{"COPILOT_PUBMED":"0"}'
        run: |
          dmg=$(ls packages/desktop/release/Qython-*-mac-*.dmg | head -1)
          hdiutil attach "$dmg" -mountpoint /Volumes/QythonInstalador -nobrowse -quiet
          cp -R /Volumes/QythonInstalador/Qython.app /Applications/
          hdiutil detach /Volumes/QythonInstalador -quiet
          /Applications/Qython.app/Contents/MacOS/Qython --smoke

      - name: Guarda os instaladores
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.name }}
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 7

      - name: Logs do app em caso de falha
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/qython-perfil/logs/*.log "$RUNNER_TEMP"/qython-perfil/logs/backend/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"; tail -n 120 "$f"; echo "::endgroup::"
          done

      - name: Guarda os logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          path: ${{ runner.temp }}/qython-perfil/logs
          if-no-files-found: ignore
