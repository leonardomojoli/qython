name: Mobile

# Constrói o APK Android de release, assinado com o keystore guardado nos
# secrets. Disparado à mão, entrega o APK como artifact; numa tag v*, também o
# anexa à release da tag, que é criada pelo release.yml (aqui nunca se cria).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # anexar o APK à release

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # Antes de qualquer setup: sem keystore não há o que construir, e o erro
      # precisa dizer quais secrets faltam.
      - name: Keystore de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error title=APK sem assinatura::faltam os secrets do repositório:$missing. Veja packages/mobile/README.md (Release assinado)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "QYTHON_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Versão
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # run_number só cresce: um APK novo sempre instala por cima do anterior.
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Fixa as versões que o android/build.gradle pede, em vez de depender do
      # que a imagem do runner traz no momento.
      - name: Android SDK 36 e NDK 27.1
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1" < /dev/null

      - name: Dependências (workspace inteiro)
        run: npm ci

      - name: Build do APK de release
        working-directory: packages/mobile/android
        env:
          QYTHON_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QYTHON_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QYTHON_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -PqythonVersionName="$VERSION" -PqythonVersionCode="$VERSION_CODE"

      # A chave de debug do repositório é pública; um APK assinado com ela
      # poderia ser "atualizado" por qualquer um. O Gradle já impede isso; esta
      # é a última barreira, e a impressão digital no resumo deixa quem baixa
      # conferir que o APK é o oficial.
      - name: Confere a assinatura
        run: |
          apk=packages/mobile/android/app/build/outputs/apk/release/app-release.apk
          certs=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::APK assinado com a chave de debug"
            exit 1
          fi
          out="qython-$VERSION-android.apk"
          mv "$apk" "$out"
          echo "APK=$out" >> "$GITHUB_ENV"
          {
            echo "### $out"
            echo
            echo '```'
            echo "$certs" | grep -i "SHA-256"
            sha256sum "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: qython-${{ env.VERSION }}-android
          path: ${{ env.APK }}
          if-no-files-found: error

      # O release.yml roda em paralelo e só cria a release depois de testar a
      # stack inteira (~20 min). Espera por ela; se não aparecer, o APK continua
      # disponível como artifact deste run.
      - name: Anexa o APK à release da tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 40); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
              exit 0
            fi
            echo "release $GITHUB_REF_NAME ainda não existe (tentativa $i/40), nova tentativa em 30 s"
            sleep 30
          done
          echo "::warning::a release $GITHUB_REF_NAME não apareceu em 20 min; o APK ficou só como artifact deste run"
