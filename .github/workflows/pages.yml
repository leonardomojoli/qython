name: Publicar site

# Publica o conteudo de site/ no GitHub Pages a cada push na main.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml", "backend/seeds/terms_of_use.py", "scripts/gerar_termos_site.py", "tests/backend/test_site_terms.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez; nao cancela a que ja esta rodando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # O termo de uso do site é gerado do texto que o app mostra, e a política de privacidade afirma que o
      # site não carrega nada de terceiros: se algo disso quebrar, a publicação para aqui.
      - name: Confere as páginas legais
        run: python3 tests/backend/test_site_terms.py

      # enablement liga o Pages na primeira execucao usando o GITHUB_TOKEN do
      # proprio workflow; um PAT comum nao tem escopo para isso pela API.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
