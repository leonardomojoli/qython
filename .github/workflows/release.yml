name: Release

# Constrói as imagens do backend e do web, sobe a stack inteira com elas e só
# então publica. Numa tag v* as imagens vão para o GHCR e a release é criada;
# disparado à mão, faz só o build e o teste — um ensaio que não publica nada.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # criar a release
  packages: write   # publicar no ghcr.io

env:
  REGISTRY: ghcr.io/leonardomojoli

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build do backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/qython-backend:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Qython backend (FastAPI)
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build do web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/web/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/qython-web:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Qython web (React + nginx)
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # O torch do PyPI vem na build CUDA, com gigabytes de nvidia-* inúteis sem
      # GPU. O Dockerfile instala a build CPU; isto impede a regressão silenciosa.
      - name: Imagem do backend sem bibliotecas CUDA
        run: |
          IMG="$REGISTRY/qython-backend:${{ steps.v.outputs.version }}"
          if docker run --rm --entrypoint pip "$IMG" list 2>/dev/null | grep -qi '^nvidia-'; then
            docker run --rm --entrypoint pip "$IMG" list 2>/dev/null | grep -i '^nvidia-'
            echo "::error::bibliotecas CUDA na imagem — o torch não veio do índice CPU"
            exit 1
          fi
          docker image ls --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | grep qython

      - name: Sobe a stack com as imagens recém-construídas
        env:
          QYTHON_VERSION: ${{ steps.v.outputs.version }}
        run: |
          printf 'GEMINI_API_KEY=teste-sem-chave\nJWT_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" > .env
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 5
          done
          [ "${ok:-}" = 1 ] || { echo "::error::backend não ficou saudável em 5 min"; exit 1; }

      - name: Verifica a stack de ponta a ponta
        run: |
          health=$(curl -fsS http://localhost:8080/api/health)
          echo "health: $health"
          [ "$health" = '{"status":"ok"}' ]

          curl -fsS http://localhost:8080/ | grep -q '<title>Qython</title>'
          echo "SPA: ok"
          # Servir o HTML não prova que o React renderiza: o app passou semanas em
          # tela branca (Firebase quebrando no import) com o <title> acima intacto.
          # O Chrome do runner executa o JS e devolve o DOM já montado.
          dom=$(google-chrome --headless=new --no-sandbox --disable-gpu \
                --virtual-time-budget=15000 --dump-dom http://localhost:8080/login 2>/dev/null)
          if ! printf '%s' "$dom" | grep -q 'type="password"'; then
            echo "::error::a tela de login não renderizou (o React quebrou no carregamento)"
            printf '%s' "$dom" | head -c 1500; exit 1
          fi
          echo "login renderizado: ok"
          # Rota do React Router: o nginx precisa devolver o index, não 404.
          curl -fsS -o /dev/null http://localhost:8080/login
          echo "fallback de rota do SPA: ok"

          tables=$(docker compose exec -T db psql -U qython -d qython -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "tabelas: $tables"
          [ "$tables" -ge 60 ]
          head=$(docker compose exec -T db psql -U qython -d qython -tAc "SELECT version_num FROM alembic_version")
          echo "alembic head: $head"
          [ -n "$head" ]

          # Instalação nova cria o schema pelos modelos, sem migrations. Estas três
          # coisas só existiam em migration e ficavam de fora sem ninguém notar.
          psql() { docker compose exec -T db psql -U qython -d qython -tAc "$1"; }
          psql "INSERT INTO audit_log (occurred_at, action) VALUES (now(), 'ci')"
          if psql "UPDATE audit_log SET action='adulterado'" 2>/dev/null; then
            echo "::error::audit_log aceitou UPDATE — trigger append-only ausente (LGPD)"; exit 1
          fi
          echo "audit_log append-only: ok"
          [ "$(psql "SELECT indisunique FROM pg_index i JOIN pg_class c ON c.oid=i.indexrelid WHERE c.relname='ix_user_consents_active'")" = "t" ]
          echo "consentimento ativo único: ok"
          # Os seeds rodam no boot de UM worker (advisory lock) enquanto o outro já
          # responde /api/health; o catálogo de medicamentos leva alguns segundos.
          # Espera o termo de uso, que é o último seed, antes de conferir.
          for i in $(seq 1 60); do
            [ "$(psql "SELECT count(*) FROM consent_documents WHERE type='terms_of_use' AND is_active")" -ge 1 ] && break
            sleep 3
          done
          prompts=$(psql "SELECT count(*) FROM copilot_prompts"); echo "prompts do copiloto: $prompts"
          [ "$prompts" -ge 15 ]
          meds=$(psql "SELECT count(*) FROM medications"); echo "medicamentos: $meds"
          [ "$meds" -gt 0 ]
          seasons=$(psql "SELECT count(*) FROM arena_seasons"); echo "temporadas da Arena: $seasons"
          [ "$seasons" -gt 0 ]
          exams=$(psql "SELECT count(*) FROM arena_exams"); echo "concursos da Arena: $exams"
          [ "$exams" -ge 7 ]

          # Instalação local recém-criada: sem captcha, SMS nem e-mail configurados, o
          # primeiro cadastro passa direto e vira o dono, e o app só abre depois do
          # aceite do termo de uso.
          api=http://localhost:8080/api
          cfg=$(curl -fsS $api/public/config); echo "config pública: $cfg"
          printf '%s' "$cfg" | grep -q '"setup_required":true'
          reg=$(curl -sS -X POST $api/auth/register/step1 \
                -F email=dona@clinica-ci.com.br -F 'password=Senha123!' -F 'full_name=Dona CI' \
                -F 'occupation=Médico' -F country=br -F identifier_number=CRM-CI)
          token=$(printf '%s' "$reg" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d.get("status") == "active" and d["user"]["is_admin"], d
          print(d["access_token"])')
          auth="Authorization: Bearer $token"
          curl -fsS $api/user/info -H "$auth" | grep -q '"terms_pending":true'
          curl -fsS -X POST $api/user/me/consents -H "$auth" -H 'Content-Type: application/json' \
               -d '{"type":"terms_of_use"}' >/dev/null
          curl -fsS $api/user/info -H "$auth" | grep -q '"terms_pending":false'
          curl -fsS $api/public/config | grep -q '"setup_required":false'
          echo "cadastro do dono e aceite do termo: ok"

          # O /api/health não toca no Chroma; isto prova que cliente e servidor
          # travados na mesma versão conversam.
          docker compose exec -T backend python -c \
            "import chromadb; print('chroma heartbeat:', chromadb.HttpClient(host='chroma', port=8000).heartbeat())"

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail=150 || true

      - name: Login no GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publica as imagens
        if: github.ref_type == 'tag'
        run: |
          V="${{ steps.v.outputs.version }}"
          for img in qython-backend qython-web; do
            docker tag "$REGISTRY/$img:$V" "$REGISTRY/$img:latest"
            docker push "$REGISTRY/$img:$V"
            docker push "$REGISTRY/$img:latest"
          done

      - name: Cria a release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Qython ${{ steps.v.outputs.version }}" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Qython ${{ steps.v.outputs.version }}" --generate-notes
          fi

  # Máquina limpa, sem login em registro nenhum: é exatamente a situação de quem
  # baixa o Qython. Falha aqui significa imagem privada ou pull quebrado.
  verifica-download-publico:
    needs: build-test-publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixa as imagens publicadas, anonimamente, e sobe a stack
        env:
          QYTHON_VERSION: ${{ needs.build-test-publish.outputs.version }}
        run: |
          printf 'GEMINI_API_KEY=teste-sem-chave\nJWT_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" > .env
          docker compose pull backend web
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 5
          done
          [ "${ok:-}" = 1 ] || { docker compose logs --tail=100; exit 1; }
          curl -fsS http://localhost:8080/ | grep -q '<title>Qython</title>'
          echo "download público: ok"
