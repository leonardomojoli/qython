# Qython — stack completa em um comando.
#
#   cp .env.example .env    # preencha ao menos GEMINI_API_KEY e JWT_SECRET_KEY
#   docker compose up -d
#   → web em http://localhost:8080, API em http://localhost:8080/api
#
# O backend e o web vêm prontos do GitHub Container Registry; nada é compilado
# na sua máquina. Para uma versão específica, fixe QYTHON_VERSION no .env
# (ex.: QYTHON_VERSION=1.0.0). Para compilar do código-fonte em vez de baixar:
#
#   docker compose up -d --build
#
# A transcrição de áudio roda na máquina (whisper), sem serviço pago: o modelo é
# baixado e carregado só na primeira transcrição. O embedder da busca híbrida
# (e5 + reranker) fica atrás de um profile; sem ele a biblioteca usa o pipeline de
# embeddings local mais leve.
#
#   docker compose --profile ml up -d     # sobe também o embedder

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qython}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qython}
      POSTGRES_DB: ${POSTGRES_DB:-qython}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qython}"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    # Travado no par do cliente (requirements.txt). O cliente fica congelado na
    # imagem do backend; com o servidor em "latest" os dois acabam se
    # desencontrando no primeiro pull depois de uma versão incompatível.
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    volumes:
      - chromadata:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

  backend:
    # Com "image" e "build" juntos, o compose tenta baixar a imagem primeiro e
    # só compila se ela não existir no registro (ou se pedirem --build).
    image: ghcr.io/leonardomojoli/qython-backend:${QYTHON_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # ~500 MB a mais na imagem; só necessário para ingerir .docx/.pptx.
        WITH_LIBREOFFICE: ${WITH_LIBREOFFICE:-false}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_started
    env_file: .env
    # Alcança uma IA local rodando fora do Docker (llama-server, Ollama) pelo nome
    # host.docker.internal, que no Linux só existe declarado assim.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # URL neutra, sem driver: backend/database.py troca para asyncpg (aplicação)
      # e config.sync_database_url para psycopg 3 (migrations e bootstrap_db).
      DATABASE_URL: postgresql://${POSTGRES_USER:-qython}:${POSTGRES_PASSWORD:-qython}@db:5432/${POSTGRES_DB:-qython}
      CHROMA_SERVER_HOST: chroma
      CHROMA_SERVER_PORT: "8000"
      # Transcrição local pelo serviço whisper abaixo. Para usar o Groq, defina
      # WHISPER_SERVER_URL vazio e GROQ_API_KEY no .env.
      WHISPER_SERVER_URL: ${WHISPER_SERVER_URL-http://whisper:8002}
      # IA local pelo serviço llm abaixo. Com GEMINI_API_KEY no .env e
      # LLM_PROVIDER=gemini, o texto vai para o Gemini.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-gemma-4}
      LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-16384}
    volumes:
      - uploads:/app/backend/static/uploads
      - permanent:/app/backend/static/permanent_uploads
    # Aplica as migrations antes de servir: sem isto o primeiro boot sobe com o
    # banco vazio e todo request quebra em tabela inexistente.
    # bootstrap_db decide entre criar o schema (banco novo) e aplicar as
    # migrations pendentes (banco existente) — a cadeia histórica não roda do
    # zero, o motivo está documentado no próprio arquivo.
    # ⚠️ Em bloco YAML ">", linha MAIS indentada que a primeira preserva a
    # quebra em vez de virar espaço — o shell receberia "--bind" como comando.
    # Todas as continuações ficam na mesma coluna de propósito.
    command: >
      sh -c "python -m backend.bootstrap_db &&
      gunicorn --workers 2 --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000 --timeout 600
      --access-logfile - --error-logfile - backend.main:app"

  web:
    image: ghcr.io/leonardomojoli/qython-web:${QYTHON_VERSION:-latest}
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

  # IA local: llama.cpp com o Gemma 4. Na primeira subida baixa o modelo (~5 GB) do
  # Hugging Face para o volume llmmodels; depois sobe em segundos. LLM_HF_REPO troca o
  # modelo (ex.: ggml-org/gemma-4-E2B-it-GGUF para máquinas com 8 GB de RAM).
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b11870
    restart: unless-stopped
    command: >
      -hf ${LLM_HF_REPO:-ggml-org/gemma-4-E4B-it-GGUF}
      -c ${LLM_CONTEXT_TOKENS:-16384} -t ${LLM_THREADS:-4} --jinja
      --host 0.0.0.0 --port 8080
    volumes:
      - llmmodels:/root/.cache/llama.cpp

  # Transcrição local (faster-whisper). WHISPER_MODEL no .env troca o modelo; o
  # padrão large-v3-turbo usa ~1 GB de RAM depois da primeira transcrição.
  whisper:
    image: ghcr.io/leonardomojoli/qython-backend:${QYTHON_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    command: uvicorn backend.whisper_server:app --host 0.0.0.0 --port 8002 --timeout-keep-alive 75
    volumes:
      - models:/root/.cache/huggingface

  # --- perfil "ml": busca híbrida da biblioteca, opcional ---

  embedder:
    profiles: ["ml"]
    image: ghcr.io/leonardomojoli/qython-backend:${QYTHON_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    command: uvicorn backend.embed_server:app --host 0.0.0.0 --port 8003 --timeout-keep-alive 75
    volumes:
      - models:/root/.cache/huggingface

volumes:
  pgdata:
  chromadata:
  uploads:
  permanent:
  models:
  llmmodels:
