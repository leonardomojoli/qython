# nginx do container web: serve o SPA e faz proxy de /api para o backend.
# Derivado do vhost de produção, sem a parte de TLS (aqui o TLS fica a cargo
# de quem publicar — Caddy, Traefik, um LB ou o Cloudflare na frente).

upstream qython_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml application/json;

    # O login do Google abre popup; sem isto o postMessage de volta é bloqueado.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    # ^~ tem prioridade sobre os regex de cache abaixo — sem isso um request de
    # API com extensão de imagem cairia na regra de cache estático.
    location ^~ /api/ {
        proxy_pass http://qython_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 100M;

        # Transcrição e geração de material levam minutos.
        proxy_connect_timeout 360s;
        proxy_send_timeout    360s;
        proxy_read_timeout    360s;
        send_timeout          360s;

        proxy_buffers 8 32k;
        proxy_buffer_size 32k;
    }

    location ^~ /static/uploads/ {
        proxy_pass http://qython_backend;
        proxy_set_header Host $host;
        add_header Accept-Ranges bytes;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Assets do Vite carregam hash no nome, então podem ser imutáveis.
    location ~* ^/assets/.*\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota desconhecida devolve o index e o React Router resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
