# Qython - Journald Configuration
# Location: /etc/systemd/journald.conf.d/qython.conf
#
# After modifying this file:
#   sudo systemctl restart systemd-journald
#   journalctl --disk-usage

[Journal]
# Limite de armazenamento total do journal
SystemMaxUse=500M

# Limite por arquivo individual
SystemMaxFileSize=50M

# Manter logs por no máximo 7 dias
MaxRetentionSec=7day

# Compressão habilitada para economizar espaço
Compress=yes

# Armazenamento persistente (sobrevive a reboots)
Storage=persistent
