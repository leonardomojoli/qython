<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Configuração mínima do fontconfig para o PDF (WeasyPrint/Pango) no app instalado. O fontconfig
  empacotado não leva o arquivo de configuração do sistema onde foi compilado, e sem configuração
  ele não acha fonte nenhuma: o PDF sairia sem texto.
-->
<fontconfig>
  <dir>WINDOWSFONTDIR</dir>
  <cachedir>LOCAL_APPDATA_FONTCONFIG_CACHE</cachedir>
</fontconfig>
