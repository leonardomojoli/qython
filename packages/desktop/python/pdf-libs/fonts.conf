<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Configuração mínima do fontconfig para o PDF (WeasyPrint/Pango) no app instalado. O
  fontconfig empacotado não leva o arquivo de configuração do sistema onde foi compilado
  (/opt/homebrew/etc/fonts, /mingw64/etc/fonts), e sem configuração ele não acha fonte nenhuma:
  o PDF sairia sem texto. As pastas que não existirem no sistema são ignoradas.
-->
<fontconfig>
  <dir>WINDOWSFONTDIR</dir>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>~/.fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <cachedir>LOCAL_APPDATA_FONTCONFIG_CACHE</cachedir>
</fontconfig>
